<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Puntini · Il Traduttore di Indecisione</title>
  <meta name="description" content="Smaschera gli indecisi che scrivono usando un sacco di puntini. Incolla il testo e scopri cosa intendevano davvero." />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <meta name="theme-color" content="#0f0f1a" />

  <!-- Open Graph per la condivisione social -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Puntini · Il Traduttore di Indecisione" />
  <meta property="og:description" content="Smaschera gli indecisi che scrivono con un sacco di puntini. Incolla il testo e scopri cosa intendevano davvero." />
  <meta property="og:url" content="https://simoneloru.github.io/Puntini/" />
  <meta property="og:image" content="https://simoneloru.github.io/Puntini/social/instagram-story.svg" />
  <meta name="twitter:card" content="summary_large_image" />

  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="dots-bg" aria-hidden="true"></div>

  <main class="app">
    <header class="hero">
      <div class="logo" aria-hidden="true">
        <span class="logo-text">Puntini</span>
        <span class="logo-dots">···</span>
      </div>
      <h1>Il Traduttore di <span class="accent">Indecisione</span></h1>
      <p class="subtitle">
        Incolla il messaggio di quella persona che non riesce a chiudere una frase…
        e scopri cosa <em>davvero</em> voleva dire.
      </p>
    </header>

    <section class="panel input-panel">
      <label for="input" class="panel-label">Testo sospetto</label>
      <textarea
        id="input"
        placeholder="ciao....&#10;come stai???&#10;ecco mi chiedevo se...."
        spellcheck="false"
      ></textarea>
      <div class="actions">
        <button id="analyze" class="btn btn-primary">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.5" y2="16.5"/></svg>
          <span>Smaschera</span>
        </button>
        <button id="example" class="btn btn-ghost">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 7 4 4 20 4 20 7"/><line x1="9" y1="20" x2="15" y2="20"/><line x1="12" y1="4" x2="12" y2="20"/></svg>
          <span>Prova un esempio</span>
        </button>
      </div>
      <div id="mode-hint" class="mode-hint"></div>
    </section>

    <section id="loading" class="panel loading hidden">
      <span class="spinner" aria-hidden="true"></span>
      <p>Interpreto i puntini…</p>
    </section>

    <section id="results" class="results hidden">
      <div id="verdict" class="verdict"></div>
      <ul id="lines" class="lines"></ul>
      <div class="actions">
        <button id="share" class="btn btn-primary">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13"/><path d="M22 2 15 22 11 13 2 9z"/></svg>
          <span>Condividi</span>
        </button>
        <button id="card" class="btn btn-primary">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          <span>Scarica card</span>
        </button>
      </div>
      <div class="actions">
        <button id="copy" class="btn btn-ghost">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
          <span>Copia il verdetto</span>
        </button>
        <button id="reset" class="btn btn-ghost">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>
          <span>Ricomincia</span>
        </button>
      </div>
    </section>

    <footer class="footer">
      <p>100% statico · nessuna API key · smaschera responsabilmente 😄</p>
    </footer>
  </main>

  <script src="traduttore.js"></script>
  <script src="ai.js"></script>
  <script src="share.js"></script>
  <script src="app.js"></script>
</body>
</html>
